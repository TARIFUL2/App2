<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TCHAT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg-color: #f0f2f5; --card-bg: #ffffff; --text-color: #1c1e21; --main-blue: #0084ff; --border-color: #dddfe2; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg-color); color: var(--text-color); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        #auth-container { position: fixed; width: 100%; height: 100%; background: #ffffff; z-index: 2000; display: flex; align-items: center; justify-content: center; }
        .auth-card { background: var(--main-blue); padding: 30px; border-radius: 20px; width: 90%; max-width: 380px; text-align: center; }
        .auth-card input { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: none; outline: none; }
        #app-interface { height: 100%; width: 100%; display: none; flex-direction: column; }
        .header { padding: 12px 15px; background: #fff; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .page-content { flex: 1; overflow-y: auto; }
        .post-card { background: #fff; border-bottom: 8px solid #f0f2f5; padding: 15px; }
        .post-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .post-content { margin: 10px 0; font-size: 15px; white-space: pre-wrap; }
        .post-actions { display: flex; border-top: 1px solid #eee; padding-top: 10px; justify-content: space-around; font-size: 14px; font-weight: 600; color: #65676b; }
        .comment-box { padding: 10px; background: #f9f9f9; border-top: 1px solid #eee; }
        .comment-item { font-size: 13px; margin-bottom: 5px; }
        .hidden { display: none !important; }
        #inbox-page, #users-page { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 1001; display: flex; flex-direction: column; }
        #chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        .bubble { max-width: 75%; padding: 8px 12px; border-radius: 15px; font-size: 14px; }
        .bubble.sent { background: var(--main-blue); color: #fff; align-self: flex-end; }
        .bubble.received { background: #e4e6eb; align-self: flex-start; }
    </style>
</head>
<body>

    <div id="auth-container">
        <div id="login-form" class="auth-card">
            <h1 style="color:white; margin-bottom:20px;">TCHAT</h1>
            <input type="text" id="loginId" placeholder="Email/Phone">
            <input type="password" id="loginPass" placeholder="Password">
            <button onclick="login()" style="width:100%; padding:12px; background:#1c1e21; color:#fff; border:none; border-radius:8px; cursor:pointer;">Log In</button>
        </div>
    </div>

    <div id="app-interface">
        <div class="header">
            <h2 onclick="showNewsfeed()" style="color:var(--main-blue);">TCHAT</h2>
            <div style="display:flex; gap:15px; align-items:center;">
                <i class="fas fa-comment-dots" onclick="openUserList()" style="font-size:20px; color:#65676b;"></i>
                <img id="myPicHeader" class="post-avatar" onclick="visitProfile(currentUser.id)">
            </div>
        </div>

        <div id="newsfeed-page" class="page-content">
            <div style="padding:15px; background:#fff; border-bottom:8px solid #f0f2f5; display:flex; gap:10px;">
                <img id="postMyPic" class="post-avatar">
                <input type="text" id="postText" placeholder="What's on your mind?" style="flex:1; border:none; background:#f0f2f5; border-radius:20px; padding:0 15px; outline:none;">
                <button onclick="createPost()" style="border:none; background:none; color:var(--main-blue); font-weight:bold;">Post</button>
            </div>
            <div id="feed-container"></div>
        </div>

        <div id="profile-page" class="page-content hidden">
            <div style="text-align:center; padding:20px; background:#fff;">
                <img id="profPic" class="post-avatar" style="width:100px; height:100px;">
                <h3 id="profName"></h3>
                <button onclick="logout()" style="color:red; background:none; border:none; margin-top:10px;">Logout</button>
            </div>
            <div id="user-posts-container"></div>
        </div>
    </div>

    <div id="users-page" class="hidden">
        <div class="header"><i class="fas fa-arrow-left" onclick="closeUserList()"></i><h2>Messages</h2><div></div></div>
        <div id="users-list"></div>
    </div>

    <div id="inbox-page" class="hidden">
        <div class="header"><i class="fas fa-arrow-left" onclick="closeInbox()"></i><h4 id="chatName"></h4><div></div></div>
        <div id="chat-box"></div>
        <div style="padding:10px; display:flex; gap:10px; border-top:1px solid #eee;">
            <input type="text" id="msgInput" placeholder="Type a message..." style="flex:1; border:none; background:#f0f2f5; border-radius:20px; padding:10px 15px; outline:none;">
            <button onclick="sendMessage()" style="border:none; background:none; color:var(--main-blue); font-size:20px;"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, get, update, off } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAT22X04lwGjaneGGW9sKzeO6hWVAA3n6g",
            authDomain: "tchat-a9707.firebaseapp.com",
            databaseURL: "https://tchat-a9707-default-rtdb.firebaseio.com",
            projectId: "tchat-a9707",
            storageBucket: "tchat-a9707.firebasestorage.app",
            messagingSenderId: "324756549796",
            appId: "1:324756549796:web:f557ebab16be9e5545f631"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        window.currentUser = JSON.parse(localStorage.getItem('user')) || null;
        let chatListener = null, currentChatId = null;
        const defPic = "https://cdn-icons-png.flaticon.com/512/149/149071.png";

        window.login = async () => {
            const e = document.getElementById('loginId').value.trim();
            const p = document.getElementById('loginPass').value.trim();
            const s = await get(ref(db, 'users'));
            let u = null;
            s.forEach(c => { if(c.val().emailPhone === e && c.val().password === p) u = c.val(); });
            if(u) { localStorage.setItem('user', JSON.stringify(u)); location.reload(); } else alert("Invalid!");
        }

        window.logout = () => { localStorage.clear(); location.reload(); }

        window.createPost = async () => {
            const t = document.getElementById('postText').value.trim();
            if(!t) return;
            await push(ref(db, 'posts'), { uid: currentUser.id, name: currentUser.username, pic: currentUser.profilePic || defPic, text: t, timestamp: Date.now() });
            document.getElementById('postText').value = "";
        }

        // COMMENT FUNCTION (FIXED)
        window.postComment = async (pid) => {
            const input = document.getElementById(`input-${pid}`);
            const text = input.value.trim();
            if(!text) return;
            await push(ref(db, `posts/${pid}/comments`), { uid: currentUser.id, name: currentUser.username, text: text });
            input.value = "";
        }

        window.renderPost = (id, p, targetId) => {
            const div = document.createElement('div');
            div.className = 'post-card';
            div.innerHTML = `
                <div class="post-header" onclick="visitProfile('${p.uid}')">
                    <img src="${p.pic || defPic}" class="post-avatar">
                    <div style="margin-left:10px;"><b>${p.name}</b><br><small>${new Date(p.timestamp).toLocaleString()}</small></div>
                </div>
                <div class="post-content">${p.text}</div>
                <div class="post-actions"><span><i class="fas fa-thumbs-up"></i> Like</span> <span><i class="fas fa-comment"></i> Comment</span></div>
                <div class="comment-box">
                    <div id="comments-${id}"></div>
                    <div style="display:flex; gap:5px; margin-top:5px;">
                        <input type="text" id="input-${id}" placeholder="Write a comment..." style="flex:1; border:none; background:#eee; border-radius:15px; padding:5px 12px; font-size:12px; outline:none;">
                        <button onclick="postComment('${id}')" style="border:none; background:none; color:var(--main-blue); font-weight:bold;">Post</button>
                    </div>
                </div>`;
            
            const target = document.getElementById(targetId);
            target.insertBefore(div, target.firstChild);

            // Real-time Comments loading
            onValue(ref(db, `posts/${id}/comments`), (snap) => {
                const commDiv = document.getElementById(`comments-${id}`);
                if(!commDiv) return;
                commDiv.innerHTML = "";
                snap.forEach(c => {
                    const d = document.createElement('div');
                    d.className = 'comment-item';
                    d.innerHTML = `<b>${c.val().name}:</b> ${c.val().text}`;
                    commDiv.appendChild(d);
                });
            });
        }

        window.showNewsfeed = () => {
            document.getElementById('profile-page').classList.add('hidden');
            document.getElementById('newsfeed-page').classList.remove('hidden');
        }

        window.visitProfile = async (uid) => {
            const s = await get(ref(db, 'users/'+uid));
            const u = s.val();
            document.getElementById('newsfeed-page').classList.add('hidden');
            document.getElementById('profile-page').classList.remove('hidden');
            document.getElementById('profPic').src = u.profilePic || defPic;
            document.getElementById('profName').innerText = u.username;
            onValue(ref(db, 'posts'), (snap) => {
                const cont = document.getElementById('user-posts-container');
                cont.innerHTML = "";
                snap.forEach(c => { if(c.val().uid === uid) renderPost(c.key, c.val(), 'user-posts-container'); });
            });
        }

        window.openUserList = () => document.getElementById('users-page').classList.remove('hidden');
        window.closeUserList = () => document.getElementById('users-page').classList.add('hidden');

        window.openInbox = (user) => {
            if(chatListener) off(ref(db, 'chats/'+currentChatId));
            document.getElementById('inbox-page').classList.remove('hidden');
            document.getElementById('chatName').innerText = user.username;
            const ids = [currentUser.id, user.id].sort();
            currentChatId = ids[0] + '_' + ids[1];
            chatListener = onValue(ref(db, 'chats/'+currentChatId), (snap) => {
                const box = document.getElementById('chat-box');
                box.innerHTML = "";
                snap.forEach(c => {
                    const b = document.createElement('div');
                    b.className = `bubble ${c.val().sender===currentUser.id?'sent':'received'}`;
                    b.textContent = c.val().text;
                    box.appendChild(b);
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        window.closeInbox = () => document.getElementById('inbox-page').classList.add('hidden');
        window.sendMessage = async () => {
            const i = document.getElementById('msgInput');
            if(!i.value.trim()) return;
            await push(ref(db, 'chats/'+currentChatId), { sender: currentUser.id, text: i.value
